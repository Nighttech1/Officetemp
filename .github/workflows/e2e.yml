name: Doc SaaS CI (unit + e2e)

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"

jobs:
  unit:
    name: Backend pytest (all non-e2e + e2e skip-ok)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
      - name: Unit + load smoke (e2e skips if FE down)
        run: pytest -q
        env:
          CELERY_TASK_ALWAYS_EAGER: "true"

  e2e:
    name: Playwright E2E (API + Next)
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install frontend deps
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Start API (eager Celery)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./.runtime/e2e.db
          JWT_SECRET: ci-e2e-secret-not-for-prod
          CELERY_TASK_ALWAYS_EAGER: "true"
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
          ARTIFACT_ROOT: ./.runtime/jobs
          CORS_ORIGINS: http://127.0.0.1:3000
          PII_SCHEMA: ""
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          S3_BUCKET: test
          PDF_ENGINE: dxpdf
        run: |
          mkdir -p .runtime/jobs
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Start Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/fe.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/login >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/login >/dev/null
      - name: Run E2E pytest
        working-directory: backend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_FORCE: "1"
        run: pytest -q tests/test_e2e_cabinet.py -m e2e
