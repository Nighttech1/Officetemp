services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docsaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docsaas}
      POSTGRES_DB: ${POSTGRES_DB:-docsaas}
    ports:
      - "5432:5432"
    volumes:
      - docsaas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docsaas} -d ${POSTGRES_DB:-docsaas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: docker compose --profile objectstore up -d minio
  minio:
    profiles: ["objectstore"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - docsaas_minio:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://docsaas:docsaas@db:5432/docsaas}
      PII_SCHEMA: ${PII_SCHEMA:-pii}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_BLOB_ROOT: ${LOCAL_BLOB_ROOT:-/app/.runtime/blobs}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-docsaas}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ARTIFACT_TTL_HOURS: ${ARTIFACT_TTL_HOURS:-24}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
    ports:
      - "8000:8000"
    volumes:
      # Jobs ZIP + local Word/Excel blobs (survives container recreate)
      - docsaas_artifacts:/app/.runtime
      - docsaas_blobs:/app/.runtime/blobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app:celery_app worker -l info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://docsaas:docsaas@db:5432/docsaas}
      PII_SCHEMA: ${PII_SCHEMA:-pii}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_BLOB_ROOT: ${LOCAL_BLOB_ROOT:-/app/.runtime/blobs}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-docsaas}
      S3_REGION: ${S3_REGION:-us-east-1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ARTIFACT_TTL_HOURS: ${ARTIFACT_TTL_HOURS:-24}
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes:
      - docsaas_artifacts:/app/.runtime
      - docsaas_blobs:/app/.runtime/blobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app:celery_app beat -l info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://docsaas:docsaas@db:5432/docsaas}
      PII_SCHEMA: ${PII_SCHEMA:-pii}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ARTIFACT_TTL_HOURS: ${ARTIFACT_TTL_HOURS:-24}
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes:
      - docsaas_artifacts:/app/.runtime
      - docsaas_blobs:/app/.runtime/blobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  docsaas_pgdata:
  docsaas_minio:
  docsaas_artifacts:
  docsaas_blobs:
